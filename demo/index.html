<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScanArt · Interactive Demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="app">
  <div id="panes"></div>

  <div id="topbar">
    <div class="help">
      <span class="robot-only"><b>WASD</b>/arrows walk · <b>QE</b> side-step · <b>Shift</b> fast · <b>G</b> pick up / put down (assisted) · <b>R</b> reset · <b>C</b> camera · </span>
      <b>drag</b> doors, drawers, objects · <b>scroll</b> zoom
    </div>
    <div id="stats"></div>
  </div>

  <div id="bottombar">
    <div class="cmdrow robot-only">
      <input id="cmd" type="text" placeholder='e.g. "go to the fridge", "pick up the book", "put it on the dining table"' autocomplete="off" spellcheck="false">
      <button id="go">Go</button>
    </div>
    <div class="row">
      <div class="chips robot-only" id="chips"></div>
      <div class="btns">
        <button id="grab" class="robot-only" title="Assisted grasp: a small object within reach is attached to the robot with a physics weld (this G1 model has no arm joints)">Pick up / put down (G)</button>
        <button id="cam" class="robot-only">Free camera (C)</button>
        <button id="reset" class="robot-only">Reset robot (R)</button>
        <button id="resetall">Reset scene</button>
      </div>
    </div>
  </div>

  <div id="dpad" class="robot-only">
    <button data-key="f" class="u">▲</button>
    <button data-key="l" class="l">◀</button>
    <button data-key="r" class="r">▶</button>
    <button data-key="b" class="d">▼</button>
  </div>

  <div id="focus">Click the view to drive the robot with the keyboard</div>
  <div id="tip"></div>
  <div id="loading"><div class="box"><div class="msg">Loading…</div><div class="bar"><i></i></div></div></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
